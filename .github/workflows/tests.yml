name: Python checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Syntax checks
        run: python -m compileall -q main.py lab tests
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Private R2 intake Worker tests
        run: node --test tests/grower_worker.test.mjs
