name: Live public-source smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '37 10 * * 1'
  push:
    paths:
      - tools/live_source_probe.py
      - .github/workflows/live_sources.yml

permissions:
  contents: read

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Probe PubMed PubChem ClinicalTrials and openFDA
        run: python -m tools.live_source_probe
